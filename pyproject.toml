[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boundarybench"
version = "0.1.0"
description = "Deterministic local-model evaluation for authority boundaries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
boundarybench = "boundarybench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boundarybench = ["suites/*.json"]

